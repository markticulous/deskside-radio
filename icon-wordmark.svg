<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Deskside Radio">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7eed2"/>
      <stop offset="1" stop-color="#d8c08d"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".14"/>
      <stop offset=".55" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".18"/>
    </linearGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6b25e"/>
      <stop offset="1" stop-color="#a5802f"/>
    </linearGradient>
    <pattern id="grain" width="9" height="9" patternUnits="userSpaceOnUse">
      <rect width="9" height="9" fill="#4a2c19"/>
      <rect width="4" height="9" fill="#412616"/>
    </pattern>
  </defs>

  <!-- cabinet -->
  <rect x="0" y="0" width="256" height="256" rx="46" fill="url(#grain)"/>
  <rect x="0" y="0" width="256" height="256" rx="46" fill="url(#sheen)"/>
  <rect x="2" y="2" width="252" height="252" rx="44" fill="none" stroke="#2c1a0f" stroke-width="4"/>

  <!-- brass bezel -->
  <rect x="17" y="17" width="222" height="222" rx="31" fill="none" stroke="url(#bezel)" stroke-width="7"/>

  <!-- lit dial glass -->
  <rect x="38" y="48" width="180" height="104" rx="11" fill="url(#glass)"/>
  <rect x="38" y="48" width="180" height="104" rx="11" fill="none" stroke="#6b5324" stroke-opacity=".35" stroke-width="2"/>

  <!-- scale -->
  <rect x="52" y="132" width="152" height="2.6" rx="1.3" fill="#6b5324" opacity=".8"/>
  <rect x="50.30" y="115.00" width="3.4" height="17" rx="1.70" fill="#6b5324" opacity="0.95"/><rect x="60.50" y="123.00" width="2" height="9" rx="1.00" fill="#6b5324" opacity="0.6"/><rect x="70.00" y="123.00" width="2" height="9" rx="1.00" fill="#6b5324" opacity="0.6"/><rect x="79.50" y="123.00" width="2" height="9" rx="1.00" fill="#6b5324" opacity="0.6"/><rect x="88.30" y="115.00" width="3.4" height="17" rx="1.70" fill="#6b5324" opacity="0.95"/><rect x="98.50" y="123.00" width="2" height="9" rx="1.00" fill="#6b5324" opacity="0.6"/><rect x="108.00" y="123.00" width="2" height="9" rx="1.00" fill="#6b5324" opacity="0.6"/><rect x="117.50" y="123.00" width="2" height="9" rx="1.00" fill="#6b5324" opacity="0.6"/><rect x="126.30" y="115.00" width="3.4" height="17" rx="1.70" fill="#6b5324" opacity="0.95"/><rect x="136.50" y="123.00" width="2" height="9" rx="1.00" fill="#6b5324" opacity="0.6"/><rect x="146.00" y="123.00" width="2" height="9" rx="1.00" fill="#6b5324" opacity="0.6"/><rect x="155.50" y="123.00" width="2" height="9" rx="1.00" fill="#6b5324" opacity="0.6"/><rect x="164.30" y="115.00" width="3.4" height="17" rx="1.70" fill="#6b5324" opacity="0.95"/><rect x="174.50" y="123.00" width="2" height="9" rx="1.00" fill="#6b5324" opacity="0.6"/><rect x="184.00" y="123.00" width="2" height="9" rx="1.00" fill="#6b5324" opacity="0.6"/><rect x="193.50" y="123.00" width="2" height="9" rx="1.00" fill="#6b5324" opacity="0.6"/><rect x="202.30" y="115.00" width="3.4" height="17" rx="1.70" fill="#6b5324" opacity="0.95"/>

  <!-- needle -->
  <rect x="148.5" y="60" width="7" height="82.0" rx="3.5" fill="#c1402f"/>
  <rect x="150.4" y="60" width="1.5" height="82.0" rx="0.8" fill="#ffffff" opacity=".3"/>

  <!-- wordmark -->
  <text x="128" y="208" text-anchor="middle" fill="#d8bd7a" font-family="Big Shoulders Display, Barlow Condensed, Arial Narrow, Impact, sans-serif" font-size="44" font-weight="800" letter-spacing="2">DESKSIDE</text>
</svg>
