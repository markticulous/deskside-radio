<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Deskside Radio"><defs><clipPath id="plate-clip"><path d="M11.5,0 H210 A46,46 0 0 1 256,46 V244.5 A11.5,11.5 0 0 1 244.5,256 H46 A46,46 0 0 1 0,210 V11.5 A11.5,11.5 0 0 1 11.5,0 Z"/></clipPath></defs><g clip-path="url(#plate-clip)">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7eed2"/>
      <stop offset="1" stop-color="#d8c08d"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".14"/>
      <stop offset=".55" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".18"/>
    </linearGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6b25e"/>
      <stop offset="1" stop-color="#a5802f"/>
    </linearGradient>
    <pattern id="grain" width="9" height="9" patternUnits="userSpaceOnUse">
      <rect width="9" height="9" fill="#4a2c19"/>
      <rect width="4" height="9" fill="#412616"/>
    </pattern>
  </defs>

  <!-- cabinet -->
  <path d="M11.5,0 H210 A46,46 0 0 1 256,46 V244.5 A11.5,11.5 0 0 1 244.5,256 H46 A46,46 0 0 1 0,210 V11.5 A11.5,11.5 0 0 1 11.5,0 Z" fill="url(#grain)"/>
  <path d="M11.5,0 H210 A46,46 0 0 1 256,46 V244.5 A11.5,11.5 0 0 1 244.5,256 H46 A46,46 0 0 1 0,210 V11.5 A11.5,11.5 0 0 1 11.5,0 Z" fill="url(#sheen)"/>
  <path d="M11.5,2 H210 A44,44 0 0 1 254,46 V244.5 A9.5,9.5 0 0 1 244.5,254 H46 A44,44 0 0 1 2,210 V11.5 A9.5,9.5 0 0 1 11.5,2 Z" fill="none" stroke="#2c1a0f" stroke-width="4"/>

